<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Redação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 class="text-center fw-bold mb-4">Acesso à Redação</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="alert alert-danger p-2 small">Usuário ou senha incorretos. Tente novamente.</div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label text-muted">Usuário</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-muted">Senha</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar no Sistema</button>
        </form>
    </div>

</body>
</html>
