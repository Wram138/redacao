<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Escrever Matéria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
    <h2 class="fw-bold">Pauta: {{ pauta.titulo }}</h2>
    <p class="text-muted mb-4">Área de edição do repórter.</p>
    
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.texto }}
        </div>
        <button type="submit" class="btn btn-primary">Salvar Matéria</button>
        <a href="{% url 'lista_pautas' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
